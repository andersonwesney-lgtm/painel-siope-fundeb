name: Sondar SIOPE (temporário)
on: workflow_dispatch
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://www.fnde.gov.br/siope/municipiosTransmitidosPorUF.do
          curl -sSL -c c.txt -b c.txt "$U" -o p.html
          echo "== opcoes"; grep -oiE '<option[^>]*>[^<]*' p.html | head -40
          grep -iE 'g-recaptcha|data-sitekey|exportar\(' p.html | head
          for f in "" xls csv pdf; do
            echo "===== formato=[$f]"
            curl -sSL -c c.txt -b c.txt -X POST "$U" --data "acao=pesquisar&formato=$f&pag=result&ano=2026&periodo=4" -D h.txt -o r.bin
            grep -iE '^(content-type|content-disposition)' h.txt; wc -c r.bin; file r.bin
            if file r.bin | grep -qi text; then sed 's/<[^>]*>/ /g' r.bin | tr -s ' \t' ' ' | grep -v '^\s*$' | grep -iE 'captcha|erro|capela|alagoas|AL |munic' | head -25; fi
          done
