# =====================================================================
# Configuração do painel nacional SIOPE x Fundeb.
# Nada aqui exige mudar código a cada período.
# =====================================================================

painel:
  titulo: Painel SIOPE e Fundeb
  subtitulo: Acompanhamento nacional das obrigações da Lei 14.113/2020
  # Endereço público (preencha depois de publicar; aparece nos PDFs)
  url_publica: "https://andersonwesney-lgtm.github.io/painel-siope-fundeb/"
  responsavel: ""

# Exercícios cobertos.
#   quantidade: N  -> o exercício corrente e os N-1 anteriores, contados a partir
#                     da data de execução. Em janeiro de 2027 passa sozinho a
#                     2026 e 2027. Escolha atual: exercício atual e o anterior.
#   lista: [2025, 2026] -> lista fixa (ignora "quantidade")
exercicios:
  quantidade: 2
  lista: []

# Coleta (API de dados abertos do SIOPE/FNDE).
coleta:
  # Exercícios recoletados a cada execução, para captar retificações e envios
  # atrasados. Exercícios mais antigos só são baixados se faltarem.
  recoletar_ultimos_exercicios: 2
  # Lista oficial de municípios do IBGE: permite mostrar quem NÃO declarou ao
  # SIOPE (ente que nunca transmitiu não aparece na base do FNDE).
  usar_lista_ibge: true
  pausa_entre_consultas_s: 0.3

# Recibos de transmissão (página pública do SIOPE, sem captcha). Completa a base aberta,
# que chega com atraso: consulta só os entes que faltam nela, a partir do período abaixo.
recibos:
  ativo: true
  a_partir_de: {ano: 2026, bimestre: 4}
  incluir_estados: true
  consultas_simultaneas: 2         # no máximo 2 consultas ao mesmo tempo
  pausa_entre_consultas_s: 1.0     # pausa mínima por consulta, em cada linha de consulta
  max_consultas_por_execucao: 3000 # o que sobrar fica para a execução seguinte
  tempo_maximo_min: 150
  parar_apos_falhas_seguidas: 8    # página fora do ar ou mudou: para e mantém o que já havia
  taxa_maxima_erros: 0.3

# Indicadores pelo webservice do SIOPE para os Tribunais de Contas (público, sem captcha).
# Para quem já transmitiu e ainda está incompleto na base aberta, nos mesmos períodos dos recibos.
indicadores_tc:
  ativo: true
  minimo_indicadores: 30           # menos que isso na base aberta = incompleto (completo tem ~47)
  incluir_estados: true
  consultas_simultaneas: 2
  pausa_entre_consultas_s: 0.5
  max_consultas_por_execucao: 6000
  tempo_maximo_min: 90
  parar_apos_falhas_seguidas: 8
  taxa_maxima_erros: 0.3

# Validações antes de publicar. Se alguma falhar, o painel publicado continua o anterior.
validacao:
  municipios_minimos: 5500         # IBGE: 5.570 municípios (5.569 + Brasília, que declara como DF)
  queda_maxima_entes_com_dados: 0.2  # queda maior que 20% em relação à última publicação = suspeito

# PDFs gerados em lote a cada atualização (além do botão no painel).
pdf_lote:
  # Para cada exercício coberto, gera para o bimestre mais recente com dados:
  brasil: true
  ufs: true
