# =====================================================================
# Prazos de transmissão ao SIOPE.
#
# Regra legal usada quando não há data oficial cadastrada:
#   Lei 14.113/2020, art. 38, § 1º: registro em até 30 dias após o
#   encerramento de cada bimestre.
#
# O FNDE pode divulgar cronograma próprio. Quando houver data oficial para um
# bimestre, cadastre em "cronograma_oficial" com a referência do ato que a
# fixou. A data oficial sempre prevalece sobre o cálculo.
# Não cadastre datas sem a referência do ato publicado.
# =====================================================================

regra_bimestral:
  dias_apos_fim_do_bimestre: 30
  dispositivo: Lei 14.113/2020, art. 38, § 1º
  consequencia: >-
    Suspensão das transferências voluntárias e da contratação de operações de
    crédito (exceto as destinadas ao refinanciamento do principal atualizado
    da dívida mobiliária).
  conferir: true

# Envio após o prazo calculado deixa o ente em "Atenção"?
#   false: o atraso aparece na tabela de prazos e no detalhe do ente, sem mudar
#          a situação (a consequência do art. 38 é para quem NÃO envia).
#   true:  todo envio após o prazo gera alerta de atenção.
envio_apos_prazo_gera_atencao: false

# Ente que não aparece na base de dados abertos do SIOPE (API do FNDE) depois do prazo.
# A base aberta é atualizada com atraso em relação ao sistema SIOPE: um ente pode já ter
# transmitido e ainda não constar nela (ex.: Capela/AL, 4º bim. 2026, em 23/10/2026).
#   atencao: alerta de atenção "Sem registro na base aberta, prazo vencido" (padrão).
#   critico: trata como "Não transmitido, prazo vencido" e torna o ente irregular.
ausente_na_base_aberta: atencao

# Dados do exercício (6º bimestre) exigidos para habilitação à
# complementação-VAAT: até 31 de agosto do exercício posterior.
regra_habilitacao_vaat:
  mes: 8
  dia: 31
  dispositivo: Lei 14.113/2020, art. 13, §§ 4º e 5º (redação da Lei 14.276/2021)
  conferir: true

# Exemplo de preenchimento (apague o "#" e informe o ato):
# cronograma_oficial:
#   2026:
#     3: {data: "AAAA-MM-DD", ato: "Informe aqui o ato do FNDE que fixou a data"}
cronograma_oficial: {}
